<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="strandTileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141922" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="strandTileStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Enclosed Obsidian Squircle Base -->
  <rect id="tile-chassis" x="4" y="4" width="120" height="120" rx="28" fill="url(#strandTileBg)" stroke="url(#strandTileStroke)" stroke-width="1.2" />

  <!-- Structural Rails (Thinned) -->
  <line id="rail-top" x1="20" y1="32" x2="108" y2="32" stroke="#334155" stroke-width="2.0" stroke-linecap="round" opacity="0.72" />
  <line id="rail-bottom" x1="20" y1="88" x2="108" y2="88" stroke="#334155" stroke-width="2.0" stroke-linecap="round" opacity="0.72" />

  <!-- Active Swell Path -->
  <path id="conduit-stream" d="M 20,64 L 28,64 C 44,64 50,48 64,48 C 78,48 84,64 100,64 L 108,64" fill="none" stroke="#38bdf8" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Memory Focal Core -->
  <circle id="node-glow" cx="64" cy="48" r="6" fill="#38bdf8" filter="url(#coreGlow)" />
  <circle id="node-center" cx="64" cy="48" r="2.2" fill="#ffffff" />
</svg>